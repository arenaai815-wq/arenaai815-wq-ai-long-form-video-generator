name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app ../workers scripts
      - run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

  frontend:
    name: Frontend (tsc + eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (mock providers, real FFmpeg)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: longform
          POSTGRES_PASSWORD: longform
          POSTGRES_DB: longform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U longform" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      DATABASE_URL: postgresql+asyncpg://longform:longform@localhost:5432/longform
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production
      STORAGE_BACKEND: local
      RENDER_PRESET: ultrafast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Migrate + seed
        working-directory: backend
        run: alembic upgrade head && python -m scripts.seed
      - name: Start API and worker
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          nohup celery -A workers.celery_app:celery_app worker -Q generation,render,maintenance -c 2 -B --loglevel INFO > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/v1/health && break; sleep 2; done
          sleep 10
      - name: Live smoke test (signup -> pipeline -> MP4)
        working-directory: backend
        run: pytest -q tests/test_api_smoke.py
        env:
          E2E_BASE_URL: http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: tail -100 /tmp/api.log; tail -100 /tmp/worker.log
